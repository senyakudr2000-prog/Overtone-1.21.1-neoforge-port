name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Find the newest NeoForge 21.1.x
        id: neo
        run: |
          v=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
              | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<[^>]+>//g' | sort -V | tail -1)
          echo "Using NeoForge $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle build --no-daemon --stacktrace -Pneo_version=${{ steps.neo.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: overtone-neoforge-1.21.1
          path: build/libs/*.jar

      - name: Publish the jar as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Overtone for NeoForge 1.21.1 (build ${{ github.run_number }})
          files: build/libs/*.jar
